name: Build VOXLINE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voxline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VOXLINE_VERSION: 2.0.0

jobs:
  windows-x64:
    name: Windows x64 VST3
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-x64-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage VST3
        run: cmake --install build --config Release --prefix package-root --component Plugins

      - name: Package Windows x64 VST3
        shell: pwsh
        run: >-
          Compress-Archive
          -Path package-root\VST3
          -DestinationPath VOXLINE-${{ env.VOXLINE_VERSION }}-Windows-x64-VST3.zip

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOXLINE-${{ env.VOXLINE_VERSION }}-Windows-x64-VST3
          path: VOXLINE-${{ env.VOXLINE_VERSION }}-Windows-x64-VST3.zip
          if-no-files-found: error

      - name: Add Windows x64 build to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VOXLINE-${{ env.VOXLINE_VERSION }}-Windows-x64-VST3.zip

  macos:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon VST3 + AU
            runner: macos-latest
            architectures: arm64
            verify_architectures: arm64
            suffix: macOS-Apple-Silicon
          - label: macOS Intel VST3 + AU
            runner: macos-15-intel
            architectures: x86_64
            verify_architectures: x86_64
            suffix: macOS-Intel
          - label: macOS Universal VST3 + AU
            runner: macos-latest
            architectures: arm64;x86_64
            verify_architectures: arm64 x86_64
            suffix: macOS-Universal

    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ matrix.suffix }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architectures }}"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Seal plug-in bundles
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - build/VOXLINE_artefacts/Release/VST3/VOXLINE.vst3
          codesign --force --deep --sign - build/VOXLINE_artefacts/Release/AU/VOXLINE.component
          codesign --verify --deep --strict build/VOXLINE_artefacts/Release/VST3/VOXLINE.vst3
          codesign --verify --deep --strict build/VOXLINE_artefacts/Release/AU/VOXLINE.component

      - name: Validate architectures
        shell: bash
        run: |
          set -euo pipefail
          vst3="build/VOXLINE_artefacts/Release/VST3/VOXLINE.vst3/Contents/MacOS/VOXLINE"
          au="build/VOXLINE_artefacts/Release/AU/VOXLINE.component/Contents/MacOS/VOXLINE"
          echo "VST3: $(lipo -archs "$vst3")"
          echo "AU:   $(lipo -archs "$au")"
          for arch in ${{ matrix.verify_architectures }}; do
            lipo "$vst3" -verify_arch "$arch"
            lipo "$au" -verify_arch "$arch"
          done

      - name: Stage plug-ins
        run: cmake --install build --config Release --prefix package-root --component Plugins

      - name: Build installer and DMG
        shell: bash
        run: |
          set -euo pipefail
          pkg="VOXLINE-${VOXLINE_VERSION}-${{ matrix.suffix }}.pkg"
          dmg="VOXLINE-${VOXLINE_VERSION}-${{ matrix.suffix }}.dmg"
          pkgbuild \
            --root package-root \
            --install-location "/Library/Audio/Plug-Ins" \
            --identifier com.onetake.voxline \
            --version "${VOXLINE_VERSION}" \
            "$pkg"
          mkdir -p dmg-root
          cp "$pkg" dmg-root/
          cp README.md MANUAL.md dmg-root/
          hdiutil create \
            -volname "VOXLINE ${VOXLINE_VERSION}" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "$dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VOXLINE-${{ env.VOXLINE_VERSION }}-${{ matrix.suffix }}
          path: VOXLINE-${{ env.VOXLINE_VERSION }}-${{ matrix.suffix }}.dmg
          if-no-files-found: error

      - name: Add macOS build to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VOXLINE-${{ env.VOXLINE_VERSION }}-${{ matrix.suffix }}.dmg

  release-docs:
    name: Add documentation to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify PDF manual
        run: test -f 'docs/VOXLINE-2.0-使用說明書.pdf'

      - name: Add PDF manual to release
        uses: softprops/action-gh-release@v2
        with:
          files: docs/VOXLINE-2.0-使用說明書.pdf
